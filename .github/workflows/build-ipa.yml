name: Build MeloNX IPA (unsigned)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: write

jobs:
  build-ipa:
    # The app's Release config targets the iOS 26.2 SDK, so we need the
    # macOS 26 image (ships Xcode 26.x). macos-15 runners top out at Xcode 16.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Apply exlaunch-dbg patch
        run: git apply patches/exlaunch_dbg.patch

      - name: Fetch native dependencies (official Dependencies folder)
        # The GitHub mirror omits src/MeloNX/MeloNX/Dependencies (~93 MB of native
        # libs: MoltenVK, SDL3, ffmpeg, libteakra, libSPIRV, BreakpointJIT...).
        # Pull them from the official StarForge repo with a sparse partial clone
        # (plain zip archives of that tree truncate mid-download).
        run: |
          set -e
          rm -rf /tmp/melonx-deps
          git clone --depth 1 --filter=blob:none --sparse https://starforgejo.dev/projects/MeloNX.git /tmp/melonx-deps
          cd /tmp/melonx-deps
          git sparse-checkout set src/MeloNX/MeloNX/Dependencies
          mkdir -p "$GITHUB_WORKSPACE/src/MeloNX/MeloNX"
          cp -R src/MeloNX/MeloNX/Dependencies "$GITHUB_WORKSPACE/src/MeloNX/MeloNX/"
          du -sh "$GITHUB_WORKSPACE/src/MeloNX/MeloNX/Dependencies"

      - name: Build & vendor Ryujinx.LibHac nupkg
        # The private feed that hosted Ryujinx.LibHac 0.21.0-alpha.129 is offline
        # (git.ryujinx.app is dead, no public mirror of the nupkg exists). The
        # source IS mirrored: codeberg.org/mmmardigan/libhac is the ryubing fork
        # (PackageId=Ryujinx.LibHac, VersionPrefix=0.21.0). Rebuild the exact
        # pinned version and vendor it so restore can resolve the reference.
        run: |
          set -e
          rm -rf /tmp/libhac-src /tmp/libhac-out
          git clone --depth 1 https://codeberg.org/mmmardigan/libhac.git /tmp/libhac-src
          cd /tmp/libhac-src
          dotnet pack src/LibHac/LibHac.csproj -c Release -p:PackageVersion=0.21.0-alpha.129 -o /tmp/libhac-out
          cp /tmp/libhac-out/Ryujinx.LibHac.0.21.0-alpha.129.nupkg "$GITHUB_WORKSPACE/packages/"
          ls -la "$GITHUB_WORKSPACE/packages/"

      - name: Vendor MoltenVK nupkg (from fetched Dependencies)
        # The private feed that hosted Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK
        # 1.2.0 is offline, so rebuild the nupkg from the official Dependencies
        # copy of libMoltenVK.dylib so NuGet restore can resolve the reference.
        run: |
          set -e
          mkdir -p packages/stage/runtimes/ios-arm64/native
          cp src/MeloNX/MeloNX/Dependencies/libMoltenVK.dylib packages/stage/runtimes/ios-arm64/native/
          cat > packages/stage/Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK.nuspec <<'NUSPEC'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK</id>
              <version>1.2.0</version>
              <authors>Ryujinx</authors>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>MoltenVK native dependency (re-vendored from official MeloNX Dependencies)</description>
            </metadata>
            <files>
              <file src="runtimes/**" target="runtimes" />
            </files>
          </package>
          NUSPEC
          (cd packages/stage && zip -qry ../Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK.1.2.0.nupkg Ryujinx.Graphics.Vulkan.Dependencies.MoltenVK.nuspec runtimes)
          rm -rf packages/stage
          ls -la packages/

      - name: Make dotnet visible to Xcode's build script
        # The "Ryujinx" legacy target runs distribution/ios/build.sh from inside
        # xcodebuild, which probes /usr/local/bin for dotnet.
        run: sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Cache: compiled Ryujinx core'
        id: core-cache
        uses: actions/cache@v4
        with:
          path: src/Ryujinx.Library/bin
          key: ryujinx-core-${{ hashFiles('src/**', '!src/MeloNX/**', 'global.json', 'Directory.Packages.props', 'nuget.config', 'distribution/ios/build.sh') }}

      - name: Mark core cache hit
        # build.sh sees this marker and skips the ~20 min NativeAOT publish
        if: steps.core-cache.outputs.cache-hit == 'true'
        run: touch .ci-core-cache-hit

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeloNX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_OPTIMIZATION_LEVEL=-Onone

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MeloNX.xcarchive/Products/Applications/MeloNX.app build/Payload/
          cd build
          zip -qry MeloNX-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-unsigned-ipa
          path: build/MeloNX-unsigned.ipa

      - name: Update release asset (only if the release tag exists)
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v2.5 build/MeloNX-unsigned.ipa --clobber -R "$GITHUB_REPOSITORY" || true
